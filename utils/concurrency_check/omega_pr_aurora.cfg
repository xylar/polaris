# The polaris config for the omega_pr serial-versus-concurrent comparison on
# Aurora.
#
# Both sides are given this file and differ only in whether `polaris setup`
# was passed `--concurrent_steps`, so the execution path is the only thing
# that changes between the runs.
#
#   polaris suite -c ocean -t omega_pr --model omega \
#       -f utils/concurrency_check/omega_pr_aurora.cfg \
#       -p <omega build> -w <work dir>/serial
#
#   polaris suite -c ocean -t omega_pr --model omega --concurrent_steps \
#       -f utils/concurrency_check/omega_pr_aurora.cfg \
#       -p <omega build> -w <work dir>/concurrent
#
# and then `qsub job_script.omega_pr.sh` in each work directory.

[job]

# The suite's own config asks for the debug target, which on Aurora is a
# queue of at most two nodes.  A concurrent omega_pr sizes itself to more
# than that -- the sum of every step's minimum cores, over 102 cores per
# node -- and a run confined to one node could not show what this exercise
# is for, since a placement that does not span nodes cannot expose a
# launcher that restarts its CPU list on each of them.
#
# capacity takes 1 to 16 nodes for up to 168 hours.  debug-scaling takes up
# to 256 for one hour and usually turns around faster, so it is the better
# target for the concurrent run once the serial baseline has said how long
# the suite takes.
scheduler_target = capacity

# long enough for the serial baseline, which on Chrysalis ran 17:49 against
# the concurrent run's 5:22.  Aurora has not been timed, so this is loose
# on purpose; the concurrent run simply exits early.
wall_time = 02:00:00
