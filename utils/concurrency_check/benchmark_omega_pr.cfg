# Benchmark omega_pr run concurrently on this branch against the same suite
# run one step at a time on main.
#
#   ./utils/benchmark/benchmark.py \
#       -f utils/concurrency_check/benchmark_omega_pr.cfg --dry-run
#
# and then without --dry-run to set both sides up and submit them.  The test
# job is submitted with a dependency on the baseline job, so the pair goes in
# together and polaris compares the concurrent run's outputs against the
# serial run's.
#
# Two questions are answered by the one pair of jobs: whether the framework
# changes on this branch changed any result, and whether running the steps at
# the same time did.  A serial baseline taken from this same branch would
# answer only the second.

[benchmark]

work_base = ${POLARIS_SCRATCH}/benchmarks/omega_pr_phase_b

# every path in this file is relative to the file itself, which is two
# levels below the branch it benchmarks
primary_path = ../..

# each worktree has its own deployment, and the polaris package in each pixi
# environment is an editable install pointing at that worktree.  Naming the
# script rather than giving an absolute path is therefore what makes the two
# sides run their own polaris; one shared script would run one branch twice.
load_script = load_polaris_chrysalis_intel_openmpi.sh

setup_command = polaris suite -c ocean -t omega_pr

submit = True

# both sides pin the same Omega commit, so one build serves both and neither
# side builds.  This is the build polaris made for the first concurrent run
# on 2026/09/08, from the commit both sides pin.
component_path = ${POLARIS_SCRATCH}/task-para-phase-b/build

# a serial omega_pr on three Chrysalis nodes has run in about 12.5 minutes,
# so this is generous for both sides
wall_time = 1:00:00

polaris_config_file = omega_pr_concurrent.cfg


[baseline]
source = existing
path = ../../../main
model = omega


[test]
source = existing
path = ../..
model = ${baseline:model}
