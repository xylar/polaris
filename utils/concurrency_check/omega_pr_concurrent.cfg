# The polaris config for the omega_pr serial-versus-concurrent comparison.
#
# Both sides of the benchmark are given this file, because `polaris setup`
# takes one config file and the driver passes the same one to each.  That is
# what makes it work: `main` has never heard of `concurrent_steps`, ignores
# it and writes the `polaris serial` job script it always would, while this
# branch reads it and writes `polaris parallel`.  One file, two job scripts,
# and the only thing that differs between the runs is the thing under test.

[job]

# run the suite's steps at the same time.  This is the whole of the test
# side; everything else here is identical on both sides.
concurrent_steps = True
