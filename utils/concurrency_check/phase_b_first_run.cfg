# Config for the first end-to-end run of `polaris parallel`.
#
# The tasks are chosen for shape rather than for coverage: each has several
# forward runs that do not depend on each other, so a scheduler that works
# shows overlap and one that does not shows a serial trace.  They are also
# short, because the first run of a new scheduler should fail quickly if it
# is going to.
#
#   polaris setup -n 80 146 170 --model omega --build \
#       -f utils/concurrency_check/phase_b_first_run.cfg \
#       -w $POLARIS_SCRATCH/task-para-phase-b
#
# and then, in the work directory, `sbatch job_script.custom.sh` for the
# serial baseline or the parallel job script beside it.

[job]

# short on purpose: these tasks take a few minutes serially, and a first run
# that hangs should not hold nodes for an hour
wall_time = 00:30:00

# Chrysalis maps this onto its debug partition
scheduler_target = debug
