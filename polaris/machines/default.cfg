# The parallel section describes options related to running tasks in parallel
[parallel]

# parallel system of execution: slurm or single_node
system = single_node

# whether to use mpirun or srun to run the model
parallel_executable = mpirun

# whether to stop Dask workers before MPI steps; required on systems that
# prohibit concurrent srun job steps (e.g. Perlmutter)
stop_workers_before_mpi = false
